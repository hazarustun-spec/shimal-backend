<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shimal Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--card:#161921;--card2:#1c2030;--border:#252a35;
  --text:#e8eaf0;--muted:#7a8099;--muted2:#4a5068;
  --accent:#c9a84c;--green:#4caf7d;--red:#e05c5c;--blue:#5b8dee;--purple:#9b7fe8;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}

/* ── Login ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:340px;text-align:center}
.login-box h1{font-size:28px;color:var(--accent);margin-bottom:6px}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:28px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;color:var(--text);font-size:15px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;background:var(--accent);color:#0d0f14;font-weight:700;font-size:15px;padding:12px;border:none;border-radius:8px;cursor:pointer}
.login-box button:hover{opacity:.9}
#login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ── App shell ── */
#app{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;height:56px}
.header-left{display:flex;align-items:center;gap:20px}
header h1{font-size:18px;color:var(--accent);letter-spacing:.5px;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:12px}
.refresh-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 13px;border-radius:8px;cursor:pointer;font-size:13px}
.refresh-btn:hover{border-color:var(--accent)}
.last-update{color:var(--muted);font-size:12px}
.logout-btn{color:var(--muted);font-size:13px;cursor:pointer;background:none;border:none}
.logout-btn:hover{color:var(--red)}

/* ── Tab navigation ── */
.tabs{display:flex;gap:2px}
.tab{padding:6px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--accent);border:1px solid var(--border)}

/* ── Tab panels ── */
.tab-panel{display:none}
.tab-panel.active{display:block}

main{padding:20px 24px;max-width:1400px;margin:0 auto}

/* ── Stat cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.card-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.card-value{font-size:26px;font-weight:700;line-height:1}
.card-sub{color:var(--muted);font-size:12px;margin-top:5px}
.card-delta{font-size:11px;margin-top:4px}
.card-delta.up{color:var(--green)}
.card-delta.dn{color:var(--red)}
.c-accent .card-value{color:var(--accent)}
.c-green  .card-value{color:var(--green)}
.c-blue   .card-value{color:var(--blue)}
.c-red    .card-value{color:var(--red)}
.c-purple .card-value{color:var(--purple)}

/* ── Grid ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:1100px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section h2 .ico{font-size:15px}

/* ── Metric rows ── */
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-name{color:var(--muted);font-size:13px}
.metric-val{font-size:14px;font-weight:600}
.ok{color:var(--green)}.warn{color:var(--accent)}.err{color:var(--red)}

/* ── Funnel ── */
.funnel{display:flex;flex-direction:column;gap:10px}
.funnel-step{display:flex;align-items:center;gap:12px}
.funnel-label{width:140px;font-size:13px;color:var(--muted);text-align:right;flex-shrink:0}
.funnel-track{flex:1;background:var(--bg);border-radius:6px;height:28px;position:relative;overflow:hidden}
.funnel-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:#0d0f14;white-space:nowrap;transition:width .6s ease}
.funnel-meta{width:90px;text-align:right;flex-shrink:0}
.funnel-count{font-size:15px;font-weight:700}
.funnel-pct{font-size:11px;color:var(--muted);margin-left:4px}
.funnel-arrow{text-align:center;color:var(--muted2);font-size:11px;padding-left:152px}

/* ── Canvas charts ── */
canvas{display:block;width:100%!important;margin-top:10px}

/* ── Sign distribution ── */
.sign-bar{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px}
.sign-name{width:76px;color:var(--muted);text-align:right;flex-shrink:0}
.sign-track{flex:1;background:var(--bg);border-radius:4px;height:15px;overflow:hidden}
.sign-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.sign-count{width:28px;flex-shrink:0;color:var(--text);font-weight:600;text-align:right}

/* ── Error log ── */
.error-list{max-height:200px;overflow-y:auto}
.error-item{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.error-item:last-child{border-bottom:none}
.error-ts{color:var(--muted);margin-right:6px}
.error-src{color:var(--accent);margin-right:5px}
.error-msg{color:var(--red)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}

/* ── Status dot ── */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.warn{background:var(--accent)}

/* ── Loading/spinner ── */
.loading{color:var(--muted);font-size:13px;text-align:center;padding:40px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Badge ── */
.badge{background:rgba(201,168,76,.12);color:var(--accent);font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid rgba(201,168,76,.25)}
.badge.green{background:rgba(76,175,125,.12);color:var(--green);border-color:rgba(76,175,125,.25)}

/* ── Engagement ring ── */
.eng-ring-wrap{display:flex;align-items:center;gap:20px;padding:10px 0}
.eng-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.eng-ring svg{transform:rotate(-90deg)}
.eng-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:700;line-height:1.2}
.eng-ring-label small{font-size:10px;color:var(--muted);font-weight:400}
.eng-ring-details{flex:1}
.eng-ring-details .erow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
.eng-ring-details .erow:last-child{border-bottom:none}
.erow .en{color:var(--muted)}
.erow .ev{font-weight:600}

/* ── Hour chart ── */
.hour-chart{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:12px}
.hour-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.hour-bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;transition:height .4s}
.hour-lbl{font-size:9px;color:var(--muted2)}

/* ── Cost cards ── */
.cost-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.cost-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center}
.cost-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.cost-card .val{font-size:22px;font-weight:700}
.cost-card .sub{font-size:11px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔮 Shimal</h1>
    <p>Admin Dashboard</p>
    <input type="password" id="pwd-input" placeholder="Şifre" autofocus>
    <button onclick="doLogin()">Giriş Yap</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="app">
  <header>
    <div class="header-left">
      <h1>🔮 Shimal</h1>
      <nav class="tabs">
        <button class="tab active" onclick="switchTab('overview',this)">Genel Bakış</button>
        <button class="tab" onclick="switchTab('monetization',this)">Maliyet & Bildirimler</button>
        <button class="tab" onclick="switchTab('system',this)">Sistem</button>
      </nav>
    </div>
    <div class="header-right">
      <span class="last-update" id="last-update">—</span>
      <button class="refresh-btn" onclick="refresh(true)">↺ Yenile</button>
      <button class="logout-btn" onclick="logout()">Çıkış</button>
    </div>
  </header>

  <main>
    <div id="content"><div class="loading"><span class="spinner"></span>Yükleniyor...</div></div>
  </main>
</div>

<script>
const BASE = window.location.origin;
let token = localStorage.getItem('shimal_dash_token');
let currentTab = 'overview';
let cachedStats = null;
let cachedTrend = null;
let refreshTimer = null;

// ── Auth ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await fetch(`${BASE}/dashboard/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Hata'; return; }
    token = d.token;
    localStorage.setItem('shimal_dash_token', token);
    showApp();
  } catch { err.textContent = 'Bağlantı hatası'; }
}
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function logout() {
  localStorage.removeItem('shimal_dash_token');
  token = null;
  clearInterval(refreshTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  refresh(true);
  refreshTimer = setInterval(() => refresh(false), 2 * 60 * 1000);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(name, el) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('tab-' + name);
  if (panel) panel.classList.add('active');
  // redraw charts when switching back to overview
  if (name === 'overview' && cachedTrend) {
    requestAnimationFrame(() => {
      drawDualChart('insight-chart', cachedTrend.days, 'Insight');
      drawDualChart('growth-chart', cachedTrend.growth, 'Kayıt');
      if (cachedStats?.supabase?.refreshHourDist) drawHourChart(cachedStats.supabase.refreshHourDist);
    });
  }
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function apiFetch(path, force = false) {
  const url = `${BASE}${path}${force ? '?force=1' : ''}`;
  const r = await fetch(url, { headers: { 'x-dashboard-token': token } });
  if (r.status === 401) { logout(); throw new Error('Oturum sona erdi'); }
  return r.json();
}

async function refresh(force = false) {
  try {
    const [stats, trend] = await Promise.all([
      apiFetch('/dashboard/stats', force),
      apiFetch('/dashboard/stats/insights', false),
    ]);
    cachedStats = stats;
    cachedTrend = trend;
    renderAll(stats, trend);
    document.getElementById('last-update').textContent =
      new Date().toLocaleTimeString('tr-TR') + (stats.cached ? ' ·  önbellekten' : '');
  } catch(e) { console.error(e); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt     = n  => n == null ? '—' : Number(n).toLocaleString('tr-TR');
const fmtUsd  = n  => n == null ? '—' : '$' + Number(n).toFixed(2);
const fmtUsd3 = n  => n == null ? '—' : '$' + Number(n).toFixed(3);
const pct     = (a,b) => b > 0 ? Math.round(a / b * 100) : 0;
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  return `${d}g ${h}s ${m}d`;
}
function ago(iso) {
  if (!iso) return '—';
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60)    return Math.floor(diff) + 'sn önce';
  if (diff < 3600)  return Math.floor(diff / 60) + 'dk önce';
  if (diff < 86400) return Math.floor(diff / 3600) + 'sa önce';
  return Math.floor(diff / 86400) + 'g önce';
}
const SIGN_TR = {Aries:'Koç',Taurus:'Boğa',Gemini:'İkizler',Cancer:'Yengeç',Leo:'Aslan',
  Virgo:'Başak',Libra:'Terazi',Scorpio:'Akrep',Sagittarius:'Yay',
  Capricorn:'Oğlak',Aquarius:'Kova',Pisces:'Balık'};
const trSign = s => SIGN_TR[s] || s || '?';
function dot(ok) { return `<span class="dot ${ok ? 'ok' : 'err'}"></span>`; }

// ── Main render ───────────────────────────────────────────────────────────────
function renderAll(stats, trend) {
  const sb = stats.supabase  || {};
  const an = stats.anthropic || {};
  const os = stats.onesignal || {};
  const sv = stats.server    || {};

  const convRate     = pct(sb.premiumUsers, sb.totalUsers);
  const pushRate     = pct(sb.usersWithPush, sb.totalUsers);
  const eng7Rate     = pct(sb.activeUsers7d, sb.totalUsers);
  const eng30Rate    = pct(sb.activeUsers30d, sb.totalUsers);
  const costPerUser  = sb.activeUsers30d > 0 ? (an.costUsd || 0) / sb.activeUsers30d : null;
  const costPerInsight = sb.insightsThisMonth > 0 ? (an.costUsd || 0) / sb.insightsThisMonth : null;

  // ── Sign bars ─────────────────────────────────────────────────────────────
  const signDist = sb.signDist || {};
  const maxSign  = Math.max(...Object.values(signDist), 1);
  const signHTML = Object.entries(signDist).sort((a,b) => b[1]-a[1]).map(([s,c]) => `
    <div class="sign-bar">
      <div class="sign-name">${trSign(s)}</div>
      <div class="sign-track"><div class="sign-fill" style="width:${Math.round(c/maxSign*100)}%"></div></div>
      <div class="sign-count">${c}</div>
    </div>`).join('') || '<div class="empty">Veri yok</div>';

  // ── Errors ────────────────────────────────────────────────────────────────
  const errHTML = !(sv.recentErrors || []).length
    ? '<div class="empty">Hata yok ✓</div>'
    : sv.recentErrors.map(e =>
        `<div class="error-item"><span class="error-ts">${e.ts.slice(11,19)}</span><span class="error-src">[${e.source}]</span><span class="error-msg">${e.message}</span></div>`
      ).join('');

  // ── Funnel steps ──────────────────────────────────────────────────────────
  const funnelSteps = [
    { label: 'Kayıt Oldu',    n: sb.totalUsers,    color: '#5b8dee', base: sb.totalUsers },
    { label: 'Push İzni',     n: sb.usersWithPush, color: '#9b7fe8', base: sb.totalUsers },
    { label: 'Aktif (30g)',   n: sb.activeUsers30d,color: '#c9a84c', base: sb.totalUsers },
    { label: 'Premium',       n: sb.premiumUsers,  color: '#4caf7d', base: sb.totalUsers },
  ];

  const funnelHTML = funnelSteps.map((step, i) => {
    const p = step.base > 0 ? Math.round(step.n / step.base * 100) : 0;
    const barW = Math.max(2, p);
    const arrow = i < funnelSteps.length - 1
      ? `<div class="funnel-arrow">↓ ${funnelSteps[i+1].n != null && step.n > 0 ? Math.round(funnelSteps[i+1].n/step.n*100) : '?'}% devam etti</div>`
      : '';
    return `
      <div class="funnel-step">
        <div class="funnel-label">${step.label}</div>
        <div class="funnel-track">
          <div class="funnel-fill" style="width:${barW}%;background:${step.color}">${p > 12 ? '%'+p : ''}</div>
        </div>
        <div class="funnel-meta">
          <span class="funnel-count">${fmt(step.n)}</span>
          <span class="funnel-pct">%${p}</span>
        </div>
      </div>${arrow}`;
  }).join('');

  // ── Engagement ring SVG ───────────────────────────────────────────────────
  function engRing(val, color, label, sub) {
    const r = 32, circ = 2 * Math.PI * r;
    const dash = circ * (val / 100);
    return `
      <div class="eng-ring-wrap">
        <div class="eng-ring">
          <svg width="80" height="80" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--border)" stroke-width="7"/>
            <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="7"
              stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
          </svg>
          <div class="eng-ring-label">${val}<small>%</small></div>
        </div>
        <div class="eng-ring-details">
          <div style="font-size:14px;font-weight:700;margin-bottom:8px">${label}</div>
          <div style="font-size:12px;color:var(--muted)">${sub}</div>
        </div>
      </div>`;
  }

  // ── Hour chart ────────────────────────────────────────────────────────────
  const hourDist = sb.refreshHourDist || {};
  const hourMax  = Math.max(...Object.values(hourDist), 1);
  const HOURS    = Array.from({length:24},(_,i)=>i);
  const hourHTML = `<div class="hour-chart">${HOURS.map(h => {
    const c = hourDist[h] || 0;
    const ht = Math.round(c / hourMax * 52) + 2;
    return `<div class="hour-bar-wrap">
      <div class="hour-bar" style="height:${ht}px;opacity:${c ? 1 : 0.2}"></div>
      <div class="hour-lbl">${h%6===0?h:''}</div>
    </div>`;
  }).join('')}</div>`;

  // ── Build HTML ────────────────────────────────────────────────────────────
  document.getElementById('content').innerHTML = `

  <!-- ══ TAB: GENEL BAKIŞ ══════════════════════════════════════════════════ -->
  <div class="tab-panel ${currentTab==='overview'?'active':''}" id="tab-overview">

    <!-- Top stat cards -->
    <div class="cards">
      <div class="card c-accent">
        <div class="card-label">Toplam Kullanıcı</div>
        <div class="card-value">${fmt(sb.totalUsers)}</div>
        <div class="card-sub">+${fmt(sb.newToday)} bugün · +${fmt(sb.newWeek)} bu hafta</div>
      </div>
      <div class="card c-blue">
        <div class="card-label">7 Günlük Aktif</div>
        <div class="card-value">${fmt(sb.activeUsers7d)}</div>
        <div class="card-sub">%${eng7Rate} oran</div>
      </div>
      <div class="card c-purple">
        <div class="card-label">30 Günlük Aktif</div>
        <div class="card-value">${fmt(sb.activeUsers30d)}</div>
        <div class="card-sub">%${eng30Rate} oran</div>
      </div>
      <div class="card c-green">
        <div class="card-label">Premium</div>
        <div class="card-value">${fmt(sb.premiumUsers)}</div>
        <div class="card-sub">%${convRate} dönüşüm</div>
      </div>
      <div class="card">
        <div class="card-label">Bugün Insight</div>
        <div class="card-value">${fmt(sb.insightsToday)}</div>
        <div class="card-sub">Bu ay: ${fmt(sb.insightsThisMonth)}</div>
      </div>
      <div class="card">
        <div class="card-label">Push Kapsama</div>
        <div class="card-value" style="font-size:22px">%${pushRate}</div>
        <div class="card-sub">${fmt(sb.usersWithPush)} cihaz</div>
      </div>
    </div>

    <!-- Funnel + Engagement -->
    <div class="grid2">
      <div class="section">
        <h2><span class="ico">🔽</span> Kullanıcı Dönüşüm Hunisi</h2>
        <div class="funnel">${funnelHTML}</div>
      </div>
      <div class="section">
        <h2><span class="ico">⚡</span> Engagement</h2>
        ${engRing(eng7Rate, 'var(--blue)', '7 Günlük Aktif Oran',
          `${fmt(sb.activeUsers7d)} kullanıcı son 7 günde insight aldı`)}
        <div style="height:1px;background:var(--border);margin:12px 0"></div>
        ${engRing(eng30Rate, 'var(--purple)', '30 Günlük Aktif Oran',
          `${fmt(sb.activeUsers30d)} kullanıcı son 30 günde insight aldı`)}
      </div>
    </div>

    <!-- Charts: Growth + Insights -->
    <div class="grid2">
      <div class="section">

// ── Bar chart (reusable) ──────────────────────────────────────────────────────
function drawDualChart(id, data, color) {
  const canvas = document.getElementById(id);
  if (!canvas || !data || !data.length) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth - 40;
  const H = 110;
  canvas.width = W; canvas.height = H;

  const max  = Math.max(...data.map(d => d.count), 1);
  const barW = Math.max(2, Math.floor((W - 20) / data.length) - 2);
  const today = new Date().toISOString().split('T')[0];

  ctx.clearRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#252a35'; ctx.lineWidth = 1;
  [.25,.5,.75,1].forEach(f => {
    const y = Math.floor(H - 18 - f * (H - 28));
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  });

  // Bars
  data.forEach((d, i) => {
    const x = 10 + i * (barW + 2);
    const h = Math.max(2, Math.round(d.count / max * (H - 28)));
    const y = H - 18 - h;
    const isToday = d.date === today;
    ctx.fillStyle = d.count === 0 ? '#252a35' : isToday ? 'var(--accent)' : color;
    ctx.beginPath(); ctx.roundRect(x, y, barW, h, 2); ctx.fill();

    // Tooltip on hover is done below
    if (i % 5 === 0 || i === data.length - 1) {
      ctx.fillStyle = '#7a8099'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(d.date.slice(5), x + barW / 2, H - 3);
    }
  });
}
