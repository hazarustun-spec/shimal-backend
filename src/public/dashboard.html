<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shimal Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--card:#161921;--card2:#1c2030;--border:#252a35;--border2:#1e2330;
  --text:#e8eaf0;--muted:#7a8099;--muted2:#3d4460;
  --accent:#c9a84c;--green:#4caf7d;--red:#e05c5c;--blue:#5b8dee;--purple:#9b7fe8;--orange:#e8924a;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}

/* ── Login ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a1025 0%,var(--bg) 60%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;width:90%;max-width:350px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.login-logo{font-size:42px;margin-bottom:12px}
.login-box h1{font-size:24px;color:var(--accent);margin-bottom:4px;font-weight:700;letter-spacing:.3px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:28px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-size:15px;outline:none;margin-bottom:12px;transition:border-color .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;background:var(--accent);color:#0d0f14;font-weight:700;font-size:15px;padding:13px;border:none;border-radius:10px;cursor:pointer;letter-spacing:.3px;transition:opacity .15s}
.login-box button:hover{opacity:.88}
#login-error{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ── App shell ── */
#app{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,15,20,.95);backdrop-filter:blur(8px);z-index:10;min-height:54px;gap:10px;flex-wrap:wrap}
@media(max-width:700px){header{padding:8px 12px;gap:6px}}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
@media(max-width:700px){.header-left{flex-direction:column;align-items:flex-start;gap:6px}}
.brand{font-size:17px;color:var(--accent);font-weight:700;letter-spacing:.3px;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.refresh-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:13px;transition:all .15s}
.refresh-btn:hover{border-color:var(--accent);color:var(--text)}
.last-update{color:var(--muted2);font-size:11px}
.logout-btn{color:var(--muted2);font-size:12px;cursor:pointer;background:none;border:none;transition:color .15s}
.logout-btn:hover{color:var(--red)}

/* ── Tabs ── */
.tabs{display:flex;gap:1px;background:var(--border2);border-radius:9px;padding:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;transition:all .15s;white-space:nowrap;flex-shrink:0}
@media(max-width:700px){.tab{padding:5px 10px;font-size:12px}}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ── Tab panels ── */
.tab-panel{display:none}
.tab-panel.active{display:block}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
@media(max-width:500px){main{padding:12px 10px}}

/* ── Stat cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 17px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:transparent}
.card.c-accent::before{background:var(--accent)}
.card.c-green::before{background:var(--green)}
.card.c-blue::before{background:var(--blue)}
.card.c-red::before{background:var(--red)}
.card.c-purple::before{background:var(--purple)}
.card.c-orange::before{background:var(--orange)}
.card-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px}
.card-value{font-size:26px;font-weight:700;line-height:1}
.c-accent .card-value{color:var(--accent)}
.c-green  .card-value{color:var(--green)}
.c-blue   .card-value{color:var(--blue)}
.c-red    .card-value{color:var(--red)}
.c-purple .card-value{color:var(--purple)}
.c-orange .card-value{color:var(--orange)}
.card-sub{color:var(--muted);font-size:12px;margin-top:5px}
.card-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;margin-top:5px;padding:2px 6px;border-radius:4px}
.card-delta.up{color:var(--green);background:rgba(76,175,125,.1)}
.card-delta.dn{color:var(--red);background:rgba(224,92,92,.1)}
.card-delta.nt{color:var(--muted);background:rgba(122,128,153,.08)}

/* ── Tracking cards row ── */
.tracking-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:500px){.tracking-row{grid-template-columns:1fr}}
.track-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.track-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.track-icon.orange{background:rgba(232,146,74,.12)}
.track-icon.green{background:rgba(76,175,125,.12)}
.track-icon.purple{background:rgba(155,127,232,.12)}
.track-body{}
.track-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.track-val{font-size:20px;font-weight:700}
.track-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ── Grid ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.section h2{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:15px;display:flex;align-items:center;gap:7px}
.section h2 .ico{font-size:15px;opacity:.9}

/* ── Quick Links ── */
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.link-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);transition:all .15s}
.link-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.link-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.link-body{min-width:0}
.link-title{font-size:14px;font-weight:600;margin-bottom:2px}
.link-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Metric rows ── */
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.metric-row:last-child{border-bottom:none}
.metric-name{color:var(--muted);font-size:13px}
.metric-val{font-size:14px;font-weight:600}
.ok{color:var(--green)}.warn{color:var(--accent)}.err{color:var(--red)}

/* ── Funnel ── */
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel-step{display:flex;align-items:center;gap:10px}
.funnel-label{width:110px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
.funnel-track{flex:1;background:var(--bg);border-radius:6px;height:26px;position:relative;overflow:hidden}
.funnel-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:700;color:rgba(13,15,20,.85);white-space:nowrap;transition:width .7s cubic-bezier(.4,0,.2,1)}
.funnel-meta{width:86px;text-align:right;flex-shrink:0}
.funnel-count{font-size:14px;font-weight:700}
.funnel-pct{font-size:11px;color:var(--muted);margin-left:3px}
.funnel-drop{text-align:center;color:var(--muted2);font-size:10px;padding-left:120px;margin:-2px 0}

/* ── Engagement grid ── */
.eng-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.eng-item{display:flex;flex-direction:column;align-items:center;padding:12px 8px;background:var(--bg);border-radius:10px;border:1px solid var(--border)}
.eng-ring{position:relative;width:72px;height:72px;flex-shrink:0}
.eng-ring svg{transform:rotate(-90deg)}
.eng-ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700;line-height:1.1}
.eng-ring-label small{font-size:9px;color:var(--muted);font-weight:400}
.eng-title{font-size:12px;font-weight:600;margin-top:8px;text-align:center}
.eng-sub{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}

/* ── Canvas charts ── */
.chart-wrap{position:relative}
canvas{display:block;width:100%!important}
.chart-tooltip{position:absolute;background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;pointer-events:none;white-space:nowrap;display:none;z-index:5}
.chart-tooltip strong{display:block;color:var(--accent);margin-bottom:1px}

/* ── Sign distribution ── */
.sign-bar{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:12px}
.sign-name{width:72px;color:var(--muted);text-align:right;flex-shrink:0}
.sign-track{flex:1;background:var(--bg);border-radius:3px;height:14px;overflow:hidden}
.sign-fill{height:100%;background:linear-gradient(90deg,var(--accent),#e8b84c);border-radius:3px;transition:width .4s}
.sign-count{width:26px;flex-shrink:0;color:var(--text);font-weight:600;text-align:right;font-size:11px}

/* ── Error log ── */
.error-list{max-height:180px;overflow-y:auto}
.error-item{padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:6px;align-items:baseline}
.error-item:last-child{border-bottom:none}
.error-ts{color:var(--muted2);flex-shrink:0}
.error-src{color:var(--accent);flex-shrink:0}
.error-msg{color:var(--red)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px}

/* ── Status dot ── */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 5px rgba(76,175,125,.5)}
.dot.err{background:var(--red)}
.dot.warn{background:var(--accent)}

/* ── Cost cards ── */
.cost-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.cost-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center}
.cost-card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.cost-card .val{font-size:22px;font-weight:700}
.cost-card .sub{font-size:11px;color:var(--muted);margin-top:4px}

/* ── Hour chart ── */
.hour-chart{display:flex;align-items:flex-end;gap:2px;height:52px;margin-top:10px}
.hour-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.hour-bar{width:100%;background:#c9a84c;border-radius:2px 2px 0 0;transition:height .4s;min-height:2px}
.hour-lbl{font-size:8px;color:var(--muted2)}

/* ── Loading ── */
.loading{color:var(--muted);font-size:13px;text-align:center;padding:60px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Badge ── */
.badge{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid;font-weight:600;letter-spacing:.3px}
.badge.amber{background:rgba(201,168,76,.1);color:var(--accent);border-color:rgba(201,168,76,.3)}
.badge.green{background:rgba(76,175,125,.1);color:var(--green);border-color:rgba(76,175,125,.3)}

/* ── Divider ── */
.divider{height:1px;background:var(--border);margin:12px 0}

/* ── Users table ── */
.users-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.users-toolbar input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;flex:1;min-width:140px;outline:none}
.users-toolbar input:focus{border-color:var(--accent)}
.users-toolbar select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:8px 10px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
.tbl th:hover{color:var(--text)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:hover td{background:rgba(201,168,76,.04)}
.tbl .premium-badge{color:var(--accent);font-weight:600}
.tbl .free-badge{color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.pager button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{color:var(--muted);font-size:12px}

/* ── Cohort heatmap ── */
.cohort-tbl{width:100%;border-collapse:collapse;font-size:11px}
.cohort-tbl th{padding:6px 8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.cohort-tbl td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);font-weight:600}
.cohort-tbl .week-label{text-align:left;color:var(--muted);font-weight:400}
.cohort-tbl .size{color:var(--text);font-weight:400}

/* ── Cron log ── */
.cron-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.cron-row:last-child{border-bottom:none}
.cron-job{color:var(--accent);font-weight:600;width:90px;flex-shrink:0}
.cron-status{width:60px;flex-shrink:0;font-weight:600}
.cron-time{color:var(--muted);flex-shrink:0;width:120px}
.cron-detail{color:var(--muted);flex:1}

/* ── Revenue ── */
.event-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.event-row:last-child{border-bottom:none}
.event-type{font-weight:600;width:130px;flex-shrink:0}
.event-amount{color:var(--green);font-weight:700;width:70px;text-align:right;flex-shrink:0}
.event-time{color:var(--muted);flex-shrink:0}

/* ── Architecture tab ── */
.arch-flow{display:flex;flex-direction:column;gap:16px;align-items:center;padding:12px 0}
.arch-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.arch-arrow{color:var(--accent);font-size:16px;opacity:.35;letter-spacing:8px;text-align:center}
.arch-node{background:rgba(201,168,76,.04);border:1.5px solid rgba(201,168,76,.15);border-radius:14px;padding:14px 18px;text-align:center;min-width:150px;max-width:195px;flex:1;transition:all .2s;text-decoration:none;color:var(--text);display:block}
.arch-node:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.4);background:rgba(201,168,76,.08)}
.arch-node .an-icon{font-size:24px;display:block;margin-bottom:4px}
.arch-node .an-name{font-size:13px;font-weight:600;margin-bottom:2px}
.arch-node .an-desc{font-size:10px;color:var(--muted);line-height:1.3}
.arch-node-center{background:rgba(201,168,76,.08);border:2px solid var(--accent);border-radius:16px;padding:18px 28px;max-width:240px;cursor:default}
.arch-node-center .an-icon{font-size:32px}
.arch-node-center .an-name{font-size:16px}
.arch-node-dim{background:rgba(255,255,255,.02);border-color:var(--border)}
.arch-node-dim:hover{border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.04)}

.int-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:14px}
.int-c{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;text-decoration:none;color:var(--text);display:block;transition:all .2s;position:relative;overflow:hidden}
.int-c:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.int-c::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:0;transition:opacity .2s}
.int-c:hover::before{opacity:1}
.int-c-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.int-c-icon{font-size:22px;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(201,168,76,.1)}
.int-c-title{font-size:14px;font-weight:600}
.int-c-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.int-c-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.int-c-rows{display:flex;flex-direction:column;gap:4px}
.int-c-row{display:flex;align-items:center;gap:6px;font-size:11px}
.int-c-lbl{color:var(--muted2);min-width:60px;flex-shrink:0}
.int-c-val{color:var(--muted);font-family:monospace;font-size:10px;background:rgba(255,255,255,.04);padding:1px 6px;border-radius:3px}
.int-c-badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:500}
.int-badge-ios{background:rgba(91,141,238,.12);color:var(--blue)}
.int-badge-be{background:rgba(155,127,232,.12);color:var(--purple)}
.int-badge-web{background:rgba(232,74,130,.12);color:#e84a82}
.int-badge-ok{background:rgba(76,175,125,.12);color:var(--green)}
.int-c-link{font-size:11px;color:var(--accent);margin-top:8px;opacity:0;transition:opacity .2s}
.int-c:hover .int-c-link{opacity:1}

.arch-cat-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:20px 0 6px;display:flex;align-items:center;gap:7px}
.arch-cat-title .ico{font-size:14px}

.flow-steps{margin-top:14px}
.flow-s{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.flow-s:last-child{border-bottom:none}
.flow-s-num{width:28px;height:28px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}
.flow-s h4{font-size:13px;font-weight:600;margin-bottom:3px}
.flow-s p{font-size:12px;color:var(--muted);line-height:1.4}
.flow-s code{font-family:monospace;font-size:10px;background:rgba(201,168,76,.1);padding:1px 5px;border-radius:3px;color:var(--accent)}

.env-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.env-tbl th{text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:2px solid var(--border)}
.env-tbl td{padding:8px 10px;border-bottom:1px solid var(--border)}
.env-tbl tr:hover td{background:rgba(201,168,76,.02)}
.env-tbl .env-n{font-family:monospace;font-size:11px;color:var(--accent)}

.checklist-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px}
@media(max-width:600px){.checklist-cols{grid-template-columns:1fr}}
.cl-col h4{font-size:13px;margin-bottom:10px}
.cl-col h4.cl-done{color:var(--green)}
.cl-col h4.cl-todo{color:var(--accent)}

</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🔮</div>
    <h1>Shimal Admin</h1>
    <p>Dashboard'a giriş yap</p>
    <input type="password" id="pwd-input" placeholder="Şifre" autofocus>
    <button onclick="doLogin()">Giriş Yap</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="app">
  <header>
    <div class="header-left">
      <span class="brand">🔮 Shimal</span>
      <nav class="tabs">
        <button class="tab active" onclick="switchTab('overview',this)">Genel Bakış</button>
        <button class="tab" onclick="switchTab('revenue',this)">Gelir</button>
        <button class="tab" onclick="switchTab('monetization',this)">Maliyet</button>
        <button class="tab" onclick="switchTab('users',this)">Kullanıcılar</button>
        <button class="tab" onclick="switchTab('system',this)">Sistem</button>
        <button class="tab" onclick="switchTab('feedback',this)">Geri Bildirim</button>
        <button class="tab" onclick="switchTab('links',this)">Kısayollar</button>
        <button class="tab" onclick="switchTab('architecture',this)">Mimari</button>
      </nav>
    </div>
    <div class="header-right">
      <span class="last-update" id="last-update">—</span>
      <button class="refresh-btn" onclick="refresh(true)">↺ Yenile</button>
      <button class="logout-btn" onclick="logout()">Çıkış</button>
    </div>
  </header>

  <main>
    <div id="content"><div class="loading"><span class="spinner"></span>Yükleniyor...</div></div>
  </main>
</div>

<script>
const BASE = window.location.origin;
let token = localStorage.getItem('shimal_dash_token');
let currentTab = 'overview';
let cachedStats = null;
let cachedTrend = null;
let cachedExtended = null;
let refreshTimer = null;
let usersPage = 1;
let usersFilter = '';
let usersSearch = '';

// ─── Token expiry ────────────────────────────────────────────────────────────
function isTokenExpired(t) {
  if (!t) return true;
  try {
    const payload = t.split('.')[0];
    const { exp } = JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
    return !exp || Date.now() >= exp;
  } catch { return true; }
}

// Periodic expiry check (every 60s)
let expiryTimer = null;
function startExpiryWatch() {
  clearInterval(expiryTimer);
  expiryTimer = setInterval(() => {
    if (isTokenExpired(token)) logout();
  }, 60 * 1000);
}

// ─── Auth ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    const r = await fetch(`${BASE}/dashboard/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Hata'; return; }
    token = d.token;
    localStorage.setItem('shimal_dash_token', token);
    showApp();
  } catch { err.textContent = 'Bağlantı hatası'; }
}
document.getElementById('pwd-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function logout() {
  localStorage.removeItem('shimal_dash_token');
  token = null;
  clearInterval(refreshTimer);
  clearInterval(expiryTimer);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd-input').value = '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  refresh(true);
  refreshTimer = setInterval(() => refresh(false), 2 * 60 * 1000);
  startExpiryWatch();
}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(name, el) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('tab-' + name);
  if (panel) panel.classList.add('active');
  // Scroll to top on tab switch for clean view
  window.scrollTo(0, 0);
  if (name === 'overview' && cachedTrend) {
    requestAnimationFrame(() => redrawCharts());
  }
  if (name === 'users') {
    loadUsers();
  }
}

// ─── Fetch ────────────────────────────────────────────────────────────────────
async function apiFetch(path, force = false) {
  const url = `${BASE}${path}${force ? '?force=1' : ''}`;
  const r = await fetch(url, { headers: { 'x-dashboard-token': token } });
  if (r.status === 401) { logout(); throw new Error('Oturum sona erdi'); }
  return r.json();
}

async function refresh(force = false) {
  try {
    const [stats, trend, extended] = await Promise.all([
      apiFetch('/dashboard/stats', force),
      apiFetch('/dashboard/stats/insights', force),
      apiFetch('/dashboard/stats/extended', force),
    ]);
    cachedStats = stats; cachedTrend = trend; cachedExtended = extended;
    renderAll(stats, trend);
    document.getElementById('last-update').textContent =
      new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
  } catch(e) { console.error(e); }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
const fmt    = n => n == null ? '—' : Number(n).toLocaleString('tr-TR');
const fmtU   = n => n == null ? '—' : '$' + Number(n).toFixed(2);
const fmtU3  = n => { if (n == null) return '—'; const v = Number(n); if (v === 0) return '$0'; if (v < 0.0001) return '$' + v.toFixed(6); if (v < 0.001) return '$' + v.toFixed(5); if (v < 0.01) return '$' + v.toFixed(4); return '$' + v.toFixed(3); };
const pct    = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
function fmtUp(s) {
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  return `${d}g ${h}s ${m}d`;
}
function ago(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return Math.floor(s) + 'sn önce';
  if (s < 3600) return Math.floor(s/60) + 'dk önce';
  if (s < 86400) return Math.floor(s/3600) + 'sa önce';
  return Math.floor(s/86400) + 'g önce';
}
const SIGN_TR = {Aries:'Koç',Taurus:'Boğa',Gemini:'İkizler',Cancer:'Yengeç',Leo:'Aslan',
  Virgo:'Başak',Libra:'Terazi',Scorpio:'Akrep',Sagittarius:'Yay',
  Capricorn:'Oğlak',Aquarius:'Kova',Pisces:'Balık'};
const trSign = s => SIGN_TR[s] || s || '?';
function dot(ok) { return `<span class="dot ${ok?'ok':'err'}"></span>`; }
function esc(s) { const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }

// Delta badge helpers
function deltaUp(val, suffix='') {
  return `<span class="card-delta up">↑ ${val}${suffix}</span>`;
}
function deltaNeutral(val, suffix='') {
  return `<span class="card-delta nt">${val}${suffix}</span>`;
}

// ─── Shared computed values ───────────────────────────────────────────────────
let _c = {}; // computed cache refreshed each renderAll

function computeShared(stats) {
  const sb = stats.supabase  || {};
  const an = stats.anthropic || {};
  const os = stats.onesignal || {};
  const fb = stats.feedback  || {};
  const sv = stats.server    || {};
  const hl = stats.health    || { memory:{heapUsedMb:0,heapTotalMb:0,rssMb:0,heapPct:0,status:'ok'}, cpu:{pct:0,status:'ok'}, db:{ok:false,latencyMs:null,status:'error'}, anthropic:{ok:false,latencyMs:null} };
  const empty = !sb.totalUsers;

  const ext = cachedExtended || {};
  const rv = ext.revenue || {};
  const cr = ext.cron    || {};
  const co = ext.cohort  || {};

  _c = { sb, an, os, fb, sv, hl, empty, rv, cr, co,
    pushRate:       pct(sb.usersWithPush, sb.totalUsers),
    convRate:       pct(sb.premiumUsers, sb.totalUsers),
    eng7Rate:       pct(sb.activeUsers7d, sb.totalUsers),
    eng30Rate:      pct(sb.activeUsers30d, sb.totalUsers),
    activationRate: pct(sb.newUsersActivated, sb.newWeek),
    costPerUser:    sb.activeUsers30d > 0 ? (an.costUsd||0) / sb.activeUsers30d : null,
    costPerInsight: sb.insightsThisMonth > 0 ? (an.costUsd||0) / sb.insightsThisMonth : null,
    profit:         rv.ok ? (rv.monthRevenue||0) - (an.costUsd||0) : null,
  };
}

// ─── Empty state helper ──────────────────────────────────────────────────────
function emptyState(msg) {
  return `<div class="empty">${esc(msg)}</div>`;
}

// ─── Engagement ring (handles 0 gracefully) ──────────────────────────────────
function ring(val, color, title, sub) {
  const v = isNaN(val) ? 0 : val;
  const r = 28, circ = 2*Math.PI*r, dash = circ*(v/100);
  const strokeAttr = v === 0
    ? `stroke="var(--border)" stroke-width="6" stroke-dasharray="4 4"`
    : `stroke="${color}" stroke-width="6" stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"`;
  return `
    <div class="eng-item">
      <div class="eng-ring">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--border)" stroke-width="6"/>
          <circle cx="36" cy="36" r="${r}" fill="none" ${strokeAttr}/>
        </svg>
        <div class="eng-ring-label">${v}<small>%</small></div>
      </div>
      <div class="eng-title">${esc(title)}</div>
      <div class="eng-sub">${esc(sub)}</div>
    </div>`;
}

// ─── Per-tab renderers ───────────────────────────────────────────────────────

function renderOverview() {
  const { sb, eng7Rate, eng30Rate, pushRate, convRate, activationRate, empty } = _c;

  if (empty) return `<div class="tab-panel active" id="tab-overview">${emptyState('Henüz kullanıcı yok. Veriler burada görünecek.')}</div>`;

  // Funnel
  const fSteps = [
    { label: 'Kayıt Oldu',  n: sb.totalUsers,    color: '#5b8dee' },
    { label: 'Push İzni',   n: sb.usersWithPush,  color: '#9b7fe8' },
    { label: 'Aktif (30g)', n: sb.activeUsers30d, color: '#c9a84c' },
    { label: 'Premium',     n: sb.premiumUsers,   color: '#4caf7d' },
  ];
  const funnelHTML = fSteps.map((step, i) => {
    const p = pct(step.n, sb.totalUsers), barW = Math.max(1, p);
    const drop = i < fSteps.length-1 && fSteps[i].n > 0
      ? `<div class="funnel-drop">↓ ${pct(fSteps[i+1].n, fSteps[i].n)}% devam etti</div>` : '';
    return `<div class="funnel-step">
        <div class="funnel-label">${esc(step.label)}</div>
        <div class="funnel-track"><div class="funnel-fill" style="width:${barW}%;background:${step.color}">${p>14?'%'+p:''}</div></div>
        <div class="funnel-meta"><span class="funnel-count">${fmt(step.n)}</span><span class="funnel-pct">%${p}</span></div>
      </div>${drop}`;
  }).join('');

  // Hour bars
  const hourDist = sb.refreshHourDist || {};
  const hourMax = Math.max(...Object.values(hourDist), 1);
  const hourHTML = `<div class="hour-chart">${Array.from({length:24},(_,h)=>{
    const c = hourDist[h]||0, ht = Math.round(c/hourMax*46)+2;
    return `<div class="hour-bar-wrap"><div class="hour-bar" style="height:${ht}px;opacity:${c?0.85:0.15}"></div><div class="hour-lbl">${h%6===0?h:''}</div></div>`;
  }).join('')}</div>`;

  // Tracking cards
  const churnColor   = (sb.churnRisk||0) > sb.totalUsers*0.5 ? '#e05c5c' : '#e8924a';
  const successColor = (sb.insightSuccessRate||0) >= 80 ? '#4caf7d' : (sb.insightSuccessRate||0) >= 50 ? '#c9a84c' : '#e05c5c';
  const actColor     = activationRate >= 60 ? '#4caf7d' : activationRate >= 30 ? '#c9a84c' : '#e05c5c';

  return `<div class="tab-panel active" id="tab-overview">
    <div class="cards">
      <div class="card c-accent"><div class="card-label">Toplam Kullanıcı</div><div class="card-value">${fmt(sb.totalUsers)}</div><div class="card-sub">Bu hafta ${deltaUp(sb.newWeek)}</div><div class="card-sub" style="margin-top:2px">Bugün +${fmt(sb.newToday)}</div></div>
      <div class="card c-blue"><div class="card-label">7g Aktif</div><div class="card-value">${fmt(sb.activeUsers7d)}</div><div class="card-sub">%${eng7Rate} oran</div></div>
      <div class="card c-purple"><div class="card-label">30g Aktif</div><div class="card-value">${fmt(sb.activeUsers30d)}</div><div class="card-sub">%${eng30Rate} oran</div></div>
      <div class="card c-green"><div class="card-label">Premium</div><div class="card-value">${fmt(sb.premiumUsers)}</div><div class="card-sub">%${convRate} dönüşüm</div></div>
      <div class="card"><div class="card-label">Bugün Insight</div><div class="card-value">${fmt(sb.insightsToday)}</div><div class="card-sub">Bu ay: ${fmt(sb.insightsThisMonth)}</div></div>
      <div class="card"><div class="card-label">Push Kapsama</div><div class="card-value" style="font-size:22px">%${pushRate}</div><div class="card-sub">${fmt(sb.usersWithPush)} cihaz</div></div>
    </div>
    <div class="tracking-row">
      <div class="track-card"><div class="track-icon orange">😴</div><div class="track-body"><div class="track-label">Churn Riski</div><div class="track-val" style="color:${churnColor}">${fmt(sb.churnRisk)}</div><div class="track-sub">30g içinde insight almadı</div></div></div>
      <div class="track-card"><div class="track-icon green">🎯</div><div class="track-body"><div class="track-label">AI Başarı Oranı</div><div class="track-val" style="color:${successColor}">%${sb.insightSuccessRate ?? '—'}</div><div class="track-sub">Bu ay push'lı kullanıcılara</div></div></div>
      <div class="track-card"><div class="track-icon purple">🚀</div><div class="track-body"><div class="track-label">Yeni Kullanıcı Aktivasyon</div><div class="track-val" style="color:${actColor}">${fmt(sb.newUsersActivated)}/${fmt(sb.newWeek)}</div><div class="track-sub">Bu hafta kayıt → insight %${activationRate}</div></div></div>
    </div>
    <div class="grid2">
      <div class="section"><h2><span class="ico">🔽</span> Dönüşüm Hunisi</h2><div class="funnel">${funnelHTML}</div></div>
      <div class="section"><h2><span class="ico">⚡</span> Engagement</h2>
        <div class="eng-grid">${ring(eng7Rate,'#5b8dee','7 Günlük',fmt(sb.activeUsers7d)+' kullanıcı')}${ring(eng30Rate,'#9b7fe8','30 Günlük',fmt(sb.activeUsers30d)+' kullanıcı')}</div>
        <div class="divider"></div><h2 style="margin-top:4px"><span class="ico">🕐</span> Tercih Edilen Saat</h2>${hourHTML}
      </div>
    </div>
    <div class="grid2">
      <div class="section"><h2><span class="ico">📈</span> Kullanıcı Büyümesi — 30 Gün</h2><div class="chart-wrap"><canvas id="growth-chart" height="100"></canvas><div class="chart-tooltip" id="tt-growth"></div></div></div>
      <div class="section"><h2><span class="ico">📅</span> Günlük Insightlar — 30 Gün</h2><div class="chart-wrap"><canvas id="insight-chart" height="100"></canvas><div class="chart-tooltip" id="tt-insight"></div></div></div>
    </div>
    ${renderCohortSection()}
  </div>`;
}

function renderMonetization() {
  const { sb, an, os, costPerUser, costPerInsight } = _c;
  return `<div class="tab-panel" id="tab-monetization">
    <div class="cost-grid">
      <div class="cost-card"><div class="lbl">Bu Ay Toplam</div><div class="val ${(an.costUsd||0)>10?'err':'ok'}">${fmtU(an.costUsd)}</div><div class="sub">Tahmin (DB)</div></div>
      <div class="cost-card"><div class="lbl">Aktif Kullanıcı Başına</div><div class="val">${costPerUser!=null?fmtU3(costPerUser):'—'}</div><div class="sub">30g aktif / ay</div></div>
      <div class="cost-card"><div class="lbl">Insight Başına</div><div class="val">${costPerInsight!=null?fmtU3(costPerInsight):'—'}</div><div class="sub">${fmt(sb.insightsThisMonth)} insight</div></div>
      <div class="cost-card"><div class="lbl">AI İstekleri</div><div class="val" style="color:var(--blue)">${fmt(an.requests)}</div><div class="sub">Bu ay</div></div>
    </div>
    <div class="grid2">
      <div class="section">
        <h2><span class="ico">🤖</span> Anthropic API <span class="badge amber">Tahmin</span></h2>
        <div class="metric-row"><span class="metric-name">Bu ay maliyet</span><span class="metric-val ${(an.costUsd||0)>10?'err':'ok'}">${fmtU(an.costUsd)}</span></div>
        <div class="metric-row"><span class="metric-name">Model</span><span class="metric-val">${esc(an.model||'—')}</span></div>
        <div class="metric-row"><span class="metric-name">Input token</span><span class="metric-val">${fmt(an.inputTokens)}</span></div>
        <div class="metric-row"><span class="metric-name">Output token</span><span class="metric-val">${fmt(an.outputTokens)}</span></div>
        <div class="metric-row"><span class="metric-name">Toplam istek</span><span class="metric-val">${fmt(an.requests)}</span></div>
        ${an.breakdown?`<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
          <div class="metric-row"><span class="metric-name">Günlük insight</span><span class="metric-val">${fmt(an.breakdown.daily?.count)} → ${fmtU(an.breakdown.daily?.costUsd)}</span></div>
          <div class="metric-row"><span class="metric-name">Kişilik analizi</span><span class="metric-val">${fmt(an.breakdown.personality?.count)} → ${fmtU(an.breakdown.personality?.costUsd)}</span></div>
        </div>`:''}
        ${!an.ok?`<div class="metric-row"><span class="metric-name">Hata</span><span class="metric-val err">${esc(an.error||'')}</span></div>`:''}
      </div>
      <div class="section">
        <h2><span class="ico">🔔</span> Push Bildirimleri (OneSignal)</h2>
        <div class="metric-row"><span class="metric-name">Kayıtlı cihaz</span><span class="metric-val">${fmt(os.players)}</span></div>
        <div class="metric-row"><span class="metric-name">Mesajlanabilir</span><span class="metric-val">${fmt(os.messagablePlayers)}</span></div>
        <div class="metric-row"><span class="metric-name">Son 30 bildirim gönderim</span><span class="metric-val">${fmt(os.totalSentRecent)}</span></div>
        <div class="metric-row"><span class="metric-name">Tıklama oranı (CTR)</span><span class="metric-val ${(os.ctrPercent||0)>40?'ok':'warn'}">%${os.ctrPercent??'—'}</span></div>
        <div class="metric-row"><span class="metric-name">Son bildirim</span><span class="metric-val">${esc(ago(os.lastSentAt))}</span></div>
        ${!os.ok?`<div class="metric-row"><span class="metric-name">Hata</span><span class="metric-val err">${esc(os.error||'Bağlanamadı')}</span></div>`:''}
      </div>
    </div>
  </div>`;
}

function renderSystem() {
  const { sb, os, sv, hl } = _c;

  // Sign bars (XSS-safe)
  const signDist = sb.signDist || {};
  const signEntries = Object.entries(signDist).sort((a,b)=>b[1]-a[1]);
  const maxSign = Math.max(...Object.values(signDist), 1);
  const signHTML = signEntries.length === 0
    ? emptyState('Burç verisi yok')
    : signEntries.map(([s,c])=>`<div class="sign-bar"><div class="sign-name">${esc(trSign(s))}</div><div class="sign-track"><div class="sign-fill" style="width:${Math.round(c/maxSign*100)}%"></div></div><div class="sign-count">${c}</div></div>`).join('');

  // Error log (XSS-safe)
  const errors = sv.recentErrors || [];
  const errHTML = errors.length === 0
    ? '<div class="empty">✓ Hata yok</div>'
    : errors.map(e => `<div class="error-item"><span class="error-ts">${esc((e.ts||'').slice(11,19))}</span><span class="error-src">[${esc(e.source||'')}]</span><span class="error-msg">${esc(e.message||'')}</span></div>`).join('');

  return `<div class="tab-panel" id="tab-system">
    <div class="cards" style="margin-bottom:14px">
      <div class="card ${hl.memory.status==='ok'?'c-green':hl.memory.status==='warning'?'c-orange':'c-red'}"><div class="card-label">Bellek (Heap)</div><div class="card-value" style="font-size:22px">%${hl.memory.heapPct}</div><div class="card-sub">${hl.memory.heapUsedMb}MB / ${hl.memory.heapTotalMb}MB</div><div class="card-sub">RSS: ${hl.memory.rssMb}MB</div></div>
      <div class="card ${hl.cpu.status==='ok'?'c-green':hl.cpu.status==='warning'?'c-orange':'c-red'}"><div class="card-label">CPU</div><div class="card-value" style="font-size:22px">%${hl.cpu.pct}</div><div class="card-sub">${hl.cpu.status==='ok'?'Normal':hl.cpu.status==='warning'?'Yüksek':'Kritik'}</div></div>
      <div class="card ${hl.db.status==='ok'?'c-green':hl.db.status==='warning'?'c-orange':'c-red'}"><div class="card-label">DB Latency</div><div class="card-value" style="font-size:22px">${hl.db.latencyMs!=null?hl.db.latencyMs+'ms':'—'}</div><div class="card-sub">${hl.db.ok?'Bağlı':'Bağlantı hatası'}</div></div>
      <div class="card ${hl.anthropic.ok?'c-green':'c-red'}"><div class="card-label">Anthropic API</div><div class="card-value" style="font-size:22px">${hl.anthropic.latencyMs!=null?hl.anthropic.latencyMs+'ms':'—'}</div><div class="card-sub">${hl.anthropic.ok?'Erişilebilir':'Erişilemiyor'}</div></div>
    </div>
    <div class="grid2">
      <div class="section">
        <h2><span class="ico">⚙️</span> Sistem Durumu</h2>
        <div class="metric-row"><span class="metric-name">Backend</span><span class="metric-val ${hl.db.ok&&hl.memory.status!=='critical'?'ok':'err'}">${dot(hl.db.ok&&hl.memory.status!=='critical')}${hl.db.ok&&hl.memory.status!=='critical'?'Sağlıklı':'Sorunlu'}</span></div>
        <div class="metric-row"><span class="metric-name">Veritabanı</span><span class="metric-val ${hl.db.ok?'ok':'err'}">${dot(hl.db.ok)}${hl.db.ok?'Bağlı ('+hl.db.latencyMs+'ms)':'Hata'}</span></div>

let _usersDebounce = null;
function usersSearchDebounce(val) {
  clearTimeout(_usersDebounce);
  _usersDebounce = setTimeout(() => { usersSearch = val; usersPage = 1; loadUsers(); }, 400);
}

async function loadUsers() {
  const wrap = document.getElementById('users-table-wrap');
  if (!wrap) return;
  wrap.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
  try {
    const params = new URLSearchParams({ page: usersPage, limit: 30, filter: usersFilter, search: usersSearch });
    const data = await apiFetch(`/dashboard/stats/users?${params}`);
    const users = data.users || [];
    const total = data.total || 0;
    const pages = data.pages || 0;

    if (!users.length) { wrap.innerHTML = emptyState('Kullanıcı bulunamadı'); return; }

    const rows = users.map(u => `<tr>
      <td>${esc(u.name)}</td>
      <td>${esc(u.email)}</td>
      <td>${esc(trSign(u.sunSign))}</td>
      <td>${u.premium?'<span class="premium-badge">Premium</span>':'<span class="free-badge">Free</span>'}</td>
      <td>${u.hasPush?'✓':'—'}</td>
      <td>${u.lastInsight?esc(u.lastInsight):'<span style="color:var(--red)">Yok</span>'}</td>
      <td>${u.feedbackTotal>0?(u.feedbackScore>0?'<span style="color:var(--green)">+'+u.feedbackScore+'</span>':'<span style="color:var(--red)">'+u.feedbackScore+'</span>'):'—'}</td>
      <td style="color:var(--muted)">${esc((u.createdAt||'').slice(0,10))}</td>
    </tr>`).join('');

    wrap.innerHTML = `
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>İsim</th><th>E-posta</th><th>Burç</th><th>Durum</th><th>Push</th><th>Son Insight</th><th>Feedback</th><th>Kayıt</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
        <span style="font-size:12px;color:var(--muted)">${fmt(total)} kullanıcı</span>
        <div class="pager">
          <button onclick="usersPage=Math.max(1,usersPage-1);loadUsers()" ${usersPage<=1?'disabled':''}>← Önceki</button>
          <span>${usersPage} / ${pages||1}</span>
          <button onclick="usersPage=Math.min(${pages},usersPage+1);loadUsers()" ${usersPage>=pages?'disabled':''}>Sonraki →</button>
        </div>
      </div>`;
  } catch(e) { wrap.innerHTML = emptyState('Hata: ' + e.message); }
}

function renderCohortSection() {
  const { co } = _c;
  if (!co.ok || !(co.cohorts||[]).length) return '';

  const sum = co.summary || {};
  const summaryCard = `<div class="cards" style="margin-bottom:12px">
    <div class="card"><div class="card-label">D1 Retention</div><div class="card-value" style="font-size:20px;color:${(sum.d1||0)>=50?'var(--green)':'var(--red)'}">${sum.d1!=null?sum.d1+'%':'—'}</div></div>
    <div class="card"><div class="card-label">D7 Retention</div><div class="card-value" style="font-size:20px;color:${(sum.d7||0)>=30?'var(--green)':'var(--red)'}">${sum.d7!=null?sum.d7+'%':'—'}</div></div>
    <div class="card"><div class="card-label">D30 Retention</div><div class="card-value" style="font-size:20px;color:${(sum.d30||0)>=15?'var(--green)':'var(--red)'}">${sum.d30!=null?sum.d30+'%':'—'}</div></div>
  </div>`;

  function heatColor(v) {
    if (v == null) return 'var(--border)';
    if (v >= 70) return 'rgba(76,175,125,.7)';
    if (v >= 50) return 'rgba(76,175,125,.45)';
    if (v >= 30) return 'rgba(201,168,76,.45)';
    if (v >= 15) return 'rgba(232,146,74,.4)';
    return 'rgba(224,92,92,.35)';
  }

  const heatRows = co.cohorts.map(c => `<tr>
    <td class="week-label">${esc(c.week)}</td>
    <td class="size">${c.size}</td>
    ${c.retention.map(v => `<td style="background:${heatColor(v)};color:var(--text)">${v!=null?v+'%':'—'}</td>`).join('')}
  </tr>`).join('');

  return `<div class="section">
    <h2><span class="ico">📊</span> Cohort Retention</h2>
    ${summaryCard}
    <div style="overflow-x:auto">
      <table class="cohort-tbl">
        <thead><tr><th>Hafta</th><th>Kişi</th><th>W0</th><th>W1</th><th>W2</th><th>W3</th><th>W4</th></tr></thead>
        <tbody>${heatRows}</tbody>
      </table>
    </div>
  </div>`;
}

  return `<div class="section">

  computeShared(stats);

  // Render all panels
  const content = document.getElementById('content');
  content.innerHTML = renderOverview() + renderRevenue() + renderMonetization() + renderUsers() + renderSystem() + renderFeedback() + renderLinks() + renderArchitecture();

  // Activate the correct tab panel
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

  // Restore scroll
  window.scrollTo(0, scrollY);

  if (currentTab === 'overview') {
    requestAnimationFrame(() => redrawCharts());

  if (currentTab === 'users') {
    loadUsers();
  }
}

// ─── Charts ───────────────────────────────────────────────────────────────────
function redrawCharts() {
  if (!cachedTrend) return;
  drawBarChart('growth-chart',  cachedTrend.growth || [], '#4caf7d', 'tt-growth');
  drawBarChart('insight-chart', cachedTrend.days   || [], '#5b8dee', 'tt-insight');
}

function drawBarChart(id, data, color, tooltipId) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  if (!data.length || data.every(d => d.count === 0)) {
    const ctx = canvas.getContext('2d');
    const W = canvas.parentElement.clientWidth - 2;
    canvas.width = W; canvas.height = 100;
    ctx.clearRect(0, 0, W, 100);
    ctx.fillStyle = '#3d4460'; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Henüz veri yok', W/2, 55);
    return;
  }
  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth - 2;
  const H = 100;
  canvas.width = W; canvas.height = H;

  const max     = Math.max(...data.map(d => d.count), 1);
  const padL    = 8, padR = 8, padB = 16, padT = 6;
  const plotW   = W - padL - padR;
  const plotH   = H - padB - padT;
  const barW    = Math.max(2, Math.floor(plotW / data.length) - 2);
  const today   = new Date().toISOString().split('T')[0];

  ctx.clearRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = '#252a35'; ctx.lineWidth = 1;
  [.33, .66, 1].forEach(f => {
    const y = Math.round(padT + plotH * (1 - f));
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
  });

  // Bars + hit areas stored for tooltip
  canvas._bars = [];
  data.forEach((d, i) => {
    const bh  = Math.max(2, Math.round(d.count / max * plotH));
    const x   = padL + i * (barW + 2);
    const y   = padT + plotH - bh;
    const isToday = d.date === today;
    ctx.fillStyle = d.count === 0 ? '#252a35' : isToday ? '#c9a84c' : color;
    ctx.globalAlpha = d.count === 0 ? 0.4 : 1;
    ctx.beginPath(); ctx.roundRect(x, y, barW, bh, [2, 2, 0, 0]); ctx.fill();
    ctx.globalAlpha = 1;
    canvas._bars.push({ x, y: padT, w: barW + 2, h: H - padB, date: d.date, count: d.count });

    // X labels every 5 bars
    if (i % 5 === 0 || i === data.length - 1) {
      ctx.fillStyle = '#4a5068'; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(d.date.slice(5), x + barW / 2, H - 3);
    }
  });

  // Tooltip on hover
  const tt = document.getElementById(tooltipId);
  if (!tt) return;
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const bar = canvas._bars.find(b => mx >= b.x && mx < b.x + b.w);
    if (bar) {
      tt.style.display = 'block';
      tt.innerHTML = `<strong>${esc(bar.date)}</strong>${esc(String(bar.count))}`;
      const tx = e.clientX - rect.left - 40;
      tt.style.left = Math.max(0, tx) + 'px';
      tt.style.top  = '0px';
    } else {
      tt.style.display = 'none';
    }
  };
  canvas.onmouseleave = () => { tt.style.display = 'none'; };
}
